<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Herbst UI</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        var herbstTheme = localStorage.getItem('herbst-theme');
        if (
          herbstTheme === 'dark' ||
          (!herbstTheme && matchMedia('(prefers-color-scheme: dark)').matches)
        )
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="leaf.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="ai-catalog" href="/.well-known/ai-catalog.json" />
    <link
      rel="preload"
      as="image"
      href="/images/landing/autumn-1-800.webp"
      fetchpriority="high"
      imagesrcset="/images/landing/autumn-1-800.webp 800w, /images/landing/autumn-1-1200.webp 1200w, /images/landing/autumn-1.webp 1600w"
      imagesizes="35vw"
      media="(min-width: 768px) and (min-height: 700px)"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,600;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
